services:
  ssai-sovereign-api:
    image: ssai-sovereign-api:latest
    container_name: ssai-sovereign-api
    ports:
      - "3100:3100"
    restart: unless-stopped
    environment:
      PORT: "3100"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3100/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

name: Executive Template PR validation
run-name: Validate PR 48 at ${{ inputs.expected_head_sha }}

on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact 40-character head commit SHA shown on PR #48
        required: true
        type: string
      validation_scope:
        description: Read-only validation to run on the pinned PR head
        required: true
        type: choice
        options:
          - focused-orchestration-suite
      confirm_read_only:
        description: Confirm this run only reads PR metadata and runs tests; it will not change the PR
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate exact PR head
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require the trusted workflow ref and explicit confirmation
        env:
          WORKFLOW_REF: ${{ github.ref }}
          CONFIRM_READ_ONLY: ${{ inputs.confirm_read_only }}
        run: |
          set -euo pipefail
          if [[ "$WORKFLOW_REF" != "refs/heads/main" ]]; then
            echo "Run this workflow from main so its definition is the reviewed default-branch version." >&2
            exit 1
          fi
          if [[ "$CONFIRM_READ_ONLY" != "true" ]]; then
            echo "Confirm the read-only scope before starting validation." >&2
            exit 1
          fi

      - name: Confirm PR #48 is open at the expected head
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          VALIDATION_SCOPE: ${{ inputs.validation_scope }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          async function main() {
            const expectedSha = process.env.EXPECTED_HEAD_SHA;
            if (!/^[0-9a-f]{40}$/.test(expectedSha || '')) {
              throw new Error('Expected head SHA must be exactly 40 lowercase hexadecimal characters.');
            }
            if (process.env.VALIDATION_SCOPE !== 'focused-orchestration-suite') {
              throw new Error('Unsupported validation scope.');
            }

            const url = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/pulls/48`;
            const headers = new Headers({
              accept: 'application/vnd.github+json',
              'x-github-api-version': '2022-11-28'
            });
            headers.set('authorization', 'Bearer ' + process.env.GH_TOKEN);
            const response = await fetch(url, {
              headers
            });
            if (!response.ok) {
              throw new Error(`Could not read PR #48 metadata (HTTP ${response.status}).`);
            }

            const pr = await response.json();
            if (pr.state !== 'open') throw new Error('PR #48 is not open.');
            if (pr.base?.ref !== 'main') throw new Error('PR #48 no longer targets main.');
            if (pr.head?.repo?.full_name !== process.env.GITHUB_REPOSITORY) {
              throw new Error('PR #48 head is not in this repository; fork code is not run by this pilot.');
            }
            if (pr.head?.sha !== expectedSha) {
              throw new Error(`PR #48 head moved. Expected ${expectedSha}; current head is ${pr.head?.sha || 'unknown'}. Review the new head before retrying.`);
            }

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `head_sha=${pr.head.sha}\n`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `## Read-only Executive Template validation\n\n- Target: [PR #48](${pr.html_url})\n- Pinned head: \`${pr.head.sha}\`\n- Scope: \`${process.env.VALIDATION_SCOPE}\`\n- Effects: metadata read, checkout, and tests only; no PR, branch, or repository writes.\n\n`);
          }

          main().catch((error) => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE

      - name: Checkout the verified PR commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.head_sha }}
          path: target
          persist-credentials: false
          fetch-depth: 1

      - name: Verify the checked-out commit
        env:
          EXPECTED_HEAD_SHA: ${{ steps.target.outputs.head_sha }}
        run: |
          set -euo pipefail
          actual="$(git -C target rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_HEAD_SHA" ]]; then
            echo "Checkout SHA does not match the verified PR head." >&2
            exit 1
          fi
          echo "Verified checkout at $actual"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run the focused Executive Template suite
        id: tests
        working-directory: target
        run: npm run test:executive-template-orchestration

      - name: Record validation outcome
        if: always()
        env:
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          {
            echo "## Validation result"
            echo
            echo "- Pinned PR head: \`${HEAD_SHA:-not validated}\`"
            echo "- Focused suite: \`${TEST_OUTCOME:-not run}\`"
            echo "- No commits, pushes, PR updates, merges, or deployments were performed."
          } >> "$GITHUB_STEP_SUMMARY"

name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  sentinel-api:
    runs-on: ubuntu-latest
    env:
      PORT: 3000
      SENTINEL_HMAC_SECRET: ci-test-hmac-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run Executive Desk typecheck
        run: pnpm run check:executive-desk:types

      - name: Run linting
        run: pnpm run lint

      - name: Run build validation
        run: pnpm run build:validate

      - name: Start API
        env:
          SENTINEL_HMAC_SECRET: ci-healthcheck-only
        run: |
          nohup node apps/api/server.js > /tmp/sentinel-api.log 2>&1 &
          sleep 2

      - name: Run healthcheck
        run: node scripts/healthcheck.js

      - name: Run deployment readiness gates
        run: pnpm run check:deployment-readiness

      - name: Dump API log on failure
        if: failure()
        run: tail -n 200 /tmp/sentinel-api.log || true

      - name: Done
        run: echo "Sentinel API health validated"

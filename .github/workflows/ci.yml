name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  sentinel-api:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      SENTINEL_HMAC_SECRET: ci-smoke-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install || true

      - name: Environment fingerprint
        run: node scripts/sentinel-doctor.js

      - name: Smoke — tier registry
        run: node scripts/check-tier-registry.js

      - name: Smoke — governance status
        run: node scripts/check-governance-status.js

      - name: Start API
        env:
          SENTINEL_HMAC_SECRET: ci-placeholder-secret
        run: |
          node apps/api/server.js &

      - name: Wait for healthcheck
        run: |
          for i in {1..15}; do
            node scripts/healthcheck.js && exit 0
            sleep 2
          done
          exit 1

      - name: Done
        run: echo "Sentinel API health validated"

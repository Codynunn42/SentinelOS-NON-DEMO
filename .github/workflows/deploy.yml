name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      IMAGE_NAME: sentinel-api
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Synchronize Sentinel API key
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az extension add --name containerapp --upgrade
            az containerapp secret set \
              --name ${{ secrets.CONTAINER_APP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --secrets "sentinel-api-key=${{ secrets.SENTINEL_API_KEY }}"

      - name: Log in to Azure Container Registry
        run: |
          ACR_NAME="${{ secrets.ACR_LOGIN_SERVER }}"
          ACR_NAME="${ACR_NAME%%.*}"
          az acr login --name "$ACR_NAME"

      - name: Build and push container image
        run: |
          docker build \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest \
            .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Azure Container Apps
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az extension add --name containerapp --upgrade
            SHORT_SHA="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
            REVISION_SUFFIX="sha-${SHORT_SHA}-${GITHUB_RUN_NUMBER}"
            az containerapp update \
              --name ${{ secrets.CONTAINER_APP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --image ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
              --set-env-vars \
                PORT=3000 \
                SENTINEL_API_KEY=secretref:sentinel-api-key \
                SENTINEL_API_KEY_TENANT=nunncloud \
                SENTINEL_API_KEY_ACTOR=sentinel.repo-reader@nunncloud.local \
                SENTINEL_API_KEY_ROLE=viewer \
                SENTINEL_API_KEY_SCOPES=repo:read,audit:read,receipt:read,approval:read \
              --ingress external \
              --target-port 3000 \
              --revision-suffix "$REVISION_SUFFIX"

      - name: Verify live deployment contract
        uses: azure/CLI@v2
        with:
          inlineScript: |
            APP_NAME="${{ secrets.CONTAINER_APP_NAME }}"
            RG="${{ secrets.AZURE_RESOURCE_GROUP }}"

            APP_JSON="$(az containerapp show --name "$APP_NAME" --resource-group "$RG" -o json)"
            SENTINEL_CONTAINER="$(printf '%s' "$APP_JSON" | python -c 'import json,sys; d=json.load(sys.stdin); c=d.get("properties",{}).get("template",{}).get("containers",[]); match=[x for x in c if x.get("name")=="sentinel"]; print(match[0] if match else "")')"
            if [ -z "$SENTINEL_CONTAINER" ]; then
              echo "sentinel container not found in live app configuration" >&2
              exit 1
            fi

            IMAGE="$(printf '%s' "$APP_JSON" | python -c 'import json,sys; d=json.load(sys.stdin); print(d.get("properties",{}).get("template",{}).get("containers",[])[0].get("image",""))')"
            EXPECTED_IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
            if [ "$IMAGE" != "$EXPECTED_IMAGE" ]; then
              echo "Container image mismatch: expected $EXPECTED_IMAGE, got $IMAGE" >&2
              exit 1
            fi

            PORT="$(printf '%s' "$APP_JSON" | python -c 'import json,sys; d=json.load(sys.stdin); env=d.get("properties",{}).get("template",{}).get("containers",[])[0].get("env",[]); print(next((e.get("value") for e in env if e.get("name") == "PORT"), ""))')"
            if [ "$PORT" != "3000" ]; then
              echo "PORT mismatch: expected 3000, got $PORT" >&2
              exit 1
            fi

            INGRESS_PORT="$(az containerapp show --name "$APP_NAME" --resource-group "$RG" --query properties.configuration.ingress.targetPort -o tsv)"
            if [ "$INGRESS_PORT" != "3000" ]; then
              echo "Ingress targetPort mismatch: expected 3000, got $INGRESS_PORT" >&2
              exit 1
            fi

            PROBES="$(az containerapp show --name "$APP_NAME" --resource-group "$RG" --query properties.template.containers[0].probes -o json)"
            echo "$PROBES"

      - name: Smoke test live endpoint
        uses: azure/CLI@v2
        with:
          inlineScript: |
            FQDN="$(az containerapp show \
              --name ${{ secrets.CONTAINER_APP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --query properties.configuration.ingress.fqdn \
              --output tsv)"

            echo "Testing https://${FQDN}/health"
            curl --fail --show-error --silent --max-time 30 "https://${FQDN}/health"
            echo

            echo "Testing authenticated protected route"
            curl --fail --show-error --silent --max-time 30 "https://${FQDN}/approvals" \
              -H "x-api-key: ${{ secrets.SENTINEL_API_KEY }}"
            echo

            az containerapp revision list \
              --name ${{ secrets.CONTAINER_APP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --query "[?trafficWeight==\`100\`].[name,healthState,provisioningState,trafficWeight]" \
              --output table

      - name: Show deployment target
        run: |
          echo "Deployed image: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          echo "Updated latest: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest"
          echo "Container App: ${{ secrets.CONTAINER_APP_NAME }}"

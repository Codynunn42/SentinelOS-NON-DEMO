name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      IMAGE_NAME: sentinel-api
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Synchronize Sentinel API key
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az extension add --name containerapp --upgrade
            az containerapp secret set \
              --name ${{ secrets.CONTAINER_APP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --secrets "sentinel-api-key=${{ secrets.SENTINEL_API_KEY }}"

      - name: Log in to Azure Container Registry
        run: |
          ACR_NAME="${{ secrets.ACR_LOGIN_SERVER }}"
          ACR_NAME="${ACR_NAME%%.*}"
          az acr login --name "$ACR_NAME"

      - name: Build and push container image
        run: |
          docker build \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest \
            .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Azure Container Apps
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az extension add --name containerapp --upgrade
            SHORT_SHA="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
            REVISION_SUFFIX="sha-${SHORT_SHA}-${GITHUB_RUN_NUMBER}"
            az containerapp update \
              --name ${{ secrets.CONTAINER_APP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --image ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
              --set-env-vars \
                SENTINEL_API_KEY=secretref:sentinel-api-key \
                SENTINEL_API_KEY_TENANT=nunncloud \
                SENTINEL_API_KEY_ACTOR=sentinel.repo-reader@nunncloud.local \
                SENTINEL_API_KEY_ROLE=reader \
                SENTINEL_API_KEY_SCOPES=repo:read,audit:read,receipt:read,approval:read \
              --revision-suffix "$REVISION_SUFFIX"

      - name: Smoke test live endpoint
        uses: azure/CLI@v2
        with:
          inlineScript: |
            FQDN="$(az containerapp show \
              --name ${{ secrets.CONTAINER_APP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --query properties.configuration.ingress.fqdn \
              --output tsv)"

            wait_for_healthy_revision() {
              local attempts=20
              local sleep_seconds=15
              local i
              for i in $(seq 1 "$attempts"); do
                row="$(az containerapp revision list \
                  --name ${{ secrets.CONTAINER_APP_NAME }} \
                  --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
                  --query "[?trafficWeight==\`100\`].[name,healthState,provisioningState]" \
                  --output tsv || true)"

                health_state="$(printf '%s\n' "$row" | awk 'NR==1 {print $2}')"
                provisioning_state="$(printf '%s\n' "$row" | awk 'NR==1 {print $3}')"

                echo "Revision check ${i}/${attempts}: health=${health_state:-unknown} provisioning=${provisioning_state:-unknown}"
                if [ "$health_state" = "Healthy" ] && [ "$provisioning_state" = "Provisioned" ]; then
                  return 0
                fi

                sleep "$sleep_seconds"
              done

              echo "Timed out waiting for healthy provisioned revision with 100% traffic."
              return 1
            }

            retry_curl() {
              local url="$1"
              local header_name="${2:-}"
              local header_value="${3:-}"
              local attempts=10
              local sleep_seconds=10
              local i
              for i in $(seq 1 "$attempts"); do
                echo "Attempt ${i}/${attempts}: ${url}"
                if [ -n "$header_name" ]; then
                  if curl --fail --show-error --silent --max-time 30 "$url" -H "${header_name}: ${header_value}"; then
                    echo
                    return 0
                  fi
                else
                  if curl --fail --show-error --silent --max-time 30 "$url"; then
                    echo
                    return 0
                  fi
                fi

                sleep "$sleep_seconds"
              done

              echo "Request did not succeed within retry window: ${url}"
              return 1
            }

            wait_for_healthy_revision

            echo "Testing https://${FQDN}/health"
            retry_curl "https://${FQDN}/health"

            echo "Testing authenticated protected route"
            retry_curl "https://${FQDN}/approvals" "x-api-key" "${{ secrets.SENTINEL_API_KEY }}"

            az containerapp revision list \
              --name ${{ secrets.CONTAINER_APP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --query "[?trafficWeight==\`100\`].[name,healthState,provisioningState,trafficWeight]" \
              --output table

      - name: Show deployment target
        run: |
          echo "Deployed image: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          echo "Updated latest: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest"
          echo "Container App: ${{ secrets.CONTAINER_APP_NAME }}"

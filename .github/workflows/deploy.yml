name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install --global pnpm@10.33.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run test suite
        run: pnpm test

      - name: Run TypeScript checks
        run: pnpm run check:executive-desk:types

      - name: Run Executive Desk end-to-end check
        run: pnpm run check:executive-desk:e2e

      - name: Verify controlled runtime storage
        run: pnpm run check:runtime-storage

      - name: Build container image
        run: docker build --tag sentinel-api:deploy-check .

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      IMAGE_NAME: sentinel-api
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Synchronize Sentinel API key
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az extension add --name containerapp --upgrade
            az containerapp secret set \
              --name ${{ secrets.CONTAINER_APP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --secrets "sentinel-api-key=${{ secrets.SENTINEL_API_KEY }}"

      - name: Log in to Azure Container Registry
        run: |
          ACR_NAME="${{ secrets.ACR_LOGIN_SERVER }}"
          ACR_NAME="${ACR_NAME%%.*}"
          az acr login --name "$ACR_NAME"

      - name: Build and push container image
        run: |
          docker build \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest \
            .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy aligned revision to Azure Container Apps
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az extension add --name containerapp --upgrade

            APP_NAME="${{ secrets.CONTAINER_APP_NAME }}"
            RESOURCE_GROUP="${{ secrets.AZURE_RESOURCE_GROUP }}"
            IMAGE_URI="${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
            SHORT_SHA="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
            REVISION_SUFFIX="sha-${SHORT_SHA}-${GITHUB_RUN_NUMBER}"
            RESOURCE_ID="$(az containerapp show \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --query id \
              --output tsv)"

            az containerapp show \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --query properties.template.containers \
              --output json > containers.json

            python3 - "$IMAGE_URI" "$REVISION_SUFFIX" <<'PY'
            import json
            import sys

            image_uri, revision_suffix = sys.argv[1:3]
            with open("containers.json", encoding="utf-8") as source:
                containers = json.load(source)

            if not containers:
                raise SystemExit("Container App has no containers to update")

            primary = next(
                (container for container in containers if container.get("name") == "sentinel"),
                containers[0],
            )
            primary["image"] = image_uri

            governed_env = {
                "PORT": {"value": "3000"},
                "SENTINEL_API_KEY": {"secretRef": "sentinel-api-key"},
                "SENTINEL_API_KEY_TENANT": {"value": "nunncloud"},
                "SENTINEL_API_KEY_ACTOR": {
                    "value": "sentinel.repo-reader@nunncloud.local"
                },
                "SENTINEL_API_KEY_ROLE": {"value": "viewer"},
                "SENTINEL_API_KEY_SCOPES": {
                    "value": "repo:read,audit:read,receipt:read,approval:read"
                },
            }
            env_by_name = {
                item.get("name"): item
                for item in primary.setdefault("env", [])
                if item.get("name")
            }
            for name, attributes in governed_env.items():
                entry = env_by_name.get(name)
                if entry is None:
                    entry = {"name": name}
                    primary["env"].append(entry)
                entry.pop("value", None)
                entry.pop("secretRef", None)
                entry.update(attributes)

            required_probe_types = {"Liveness", "Readiness", "Startup"}
            aligned_probe_types = set()
            for probe in primary.get("probes", []):
                probe_type = probe.get("type")
                if probe_type in required_probe_types and "httpGet" in probe:
                    probe["httpGet"]["path"] = "/health"
                    probe["httpGet"]["port"] = 3000
                    probe["httpGet"]["scheme"] = "HTTP"
                    aligned_probe_types.add(probe_type)

            missing = required_probe_types - aligned_probe_types
            if missing:
                raise SystemExit(
                    "Missing HTTP health probes: " + ", ".join(sorted(missing))
                )

            patch = {
                "properties": {
                    "template": {
                        "revisionSuffix": revision_suffix,
                        "containers": containers,
                    }
                }
            }
            with open("containerapp-patch.json", "w", encoding="utf-8") as target:
                json.dump(patch, target)
            PY

            az rest \
              --method patch \
              --uri "https://management.azure.com${RESOURCE_ID}?api-version=2025-01-01" \
              --headers "Content-Type=application/merge-patch+json" \
              --body @containerapp-patch.json \
              --output none

            az containerapp ingress update \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --target-port 3000 \
              --output none

      - name: Verify deployed revision and live authorization boundary
        uses: azure/CLI@v2
        with:
          inlineScript: |
            APP_NAME="${{ secrets.CONTAINER_APP_NAME }}"
            RESOURCE_GROUP="${{ secrets.AZURE_RESOURCE_GROUP }}"
            SHORT_SHA="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
            REVISION_SUFFIX="sha-${SHORT_SHA}-${GITHUB_RUN_NUMBER}"
            REVISION_NAME="${APP_NAME}--${REVISION_SUFFIX}"
            EXPECTED_IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
            FQDN="$(az containerapp show \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --query properties.configuration.ingress.fqdn \
              --output tsv)"

            wait_for_deployed_revision() {
              local attempts=20
              local sleep_seconds=15
              local i
              for i in $(seq 1 "$attempts"); do
                health_state="$(az containerapp revision show \
                  --name "$APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --revision "$REVISION_NAME" \
                  --query properties.healthState \
                  --output tsv 2>/dev/null || true)"
                provisioning_state="$(az containerapp revision show \
                  --name "$APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --revision "$REVISION_NAME" \
                  --query properties.provisioningState \
                  --output tsv 2>/dev/null || true)"
                active="$(az containerapp revision show \
                  --name "$APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --revision "$REVISION_NAME" \
                  --query properties.active \
                  --output tsv 2>/dev/null || true)"

                echo "Revision check ${i}/${attempts}: name=${REVISION_NAME} health=${health_state:-unknown} provisioning=${provisioning_state:-unknown} active=${active:-unknown}"
                if [ "$health_state" = "Healthy" ] &&
                   [ "$provisioning_state" = "Provisioned" ] &&
                   [ "$active" = "true" ]; then
                  return 0
                fi

                sleep "$sleep_seconds"
              done

              echo "Timed out waiting for the deployed revision to become active, Healthy, and Provisioned."
              return 1
            }

            request_with_retry() {
              local label="$1"
              local url="$2"
              local expected_codes="$3"
              local header_name="${4:-}"
              local header_value="${5:-}"
              local attempts=10
              local sleep_seconds=10
              local body_file
              local status
              local i
              body_file="$(mktemp)"

              for i in $(seq 1 "$attempts"); do
                if [ -n "$header_name" ]; then
                  status="$(curl --show-error --silent --max-time 30 \
                    --output "$body_file" \
                    --write-out '%{http_code}' \
                    --header "${header_name}: ${header_value}" \
                    "$url" || true)"
                else
                  status="$(curl --show-error --silent --max-time 30 \
                    --output "$body_file" \
                    --write-out '%{http_code}' \
                    "$url" || true)"
                fi

                echo "${label} attempt ${i}/${attempts}: HTTP ${status:-000}"
                case " ${expected_codes} " in
                  *" ${status} "*)
                    python3 - "$body_file" "$label" <<'PY'
            import json
            import sys

            path, label = sys.argv[1:3]
            with open(path, encoding="utf-8") as response:
                payload = json.load(response)

            if label == "health":
                if not isinstance(payload, dict) or payload.get("status") != "ok":
                    raise SystemExit("/health did not return status=ok")
                print("health payload: status=ok")
            elif isinstance(payload, dict):
                print(f"{label} payload: JSON object keys={sorted(payload.keys())}")
            elif isinstance(payload, list):
                print(f"{label} payload: JSON array length={len(payload)}")
            else:
                raise SystemExit(f"{label} returned an unexpected JSON shape")
            PY
                    rm -f "$body_file"
                    return 0
                    ;;
                esac

                sleep "$sleep_seconds"
              done

              rm -f "$body_file"
              echo "${label} did not return expected HTTP status: ${expected_codes}"
              return 1
            }

            wait_for_deployed_revision

            latest_revision="$(az containerapp show \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --query properties.latestRevisionName \
              --output tsv)"
            latest_traffic="$(az containerapp show \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --query "properties.configuration.ingress.traffic[?latestRevision == \`true\`].weight | [0]" \
              --output tsv)"
            deployed_image="$(az containerapp revision show \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --revision "$REVISION_NAME" \
              --query "properties.template.containers[0].image" \
              --output tsv)"

            test "$latest_revision" = "$REVISION_NAME"
            test "$latest_traffic" = "100"
            test "$deployed_image" = "$EXPECTED_IMAGE"
            echo "Provenance verified: revision=${REVISION_NAME} image-tag=${GITHUB_SHA} traffic=100"

            request_with_retry \
              "health" \
              "https://${FQDN}/health" \
              "200"

            request_with_retry \
              "approvals-authenticated" \
              "https://${FQDN}/approvals" \
              "200" \
              "x-api-key" \
              "${{ secrets.SENTINEL_API_KEY }}"

            request_with_retry \
              "approvals-unauthenticated" \
              "https://${FQDN}/approvals" \
              "401 403"

            az containerapp revision show \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --revision "$REVISION_NAME" \
              --query "[name,properties.healthState,properties.provisioningState,properties.active,properties.template.containers[0].image]" \
              --output table

      - name: Show deployment target
        run: |
          echo "Deployed image: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          echo "Updated latest: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest"
          echo "Container App: ${{ secrets.CONTAINER_APP_NAME }}"

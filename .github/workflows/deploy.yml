name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      IMAGE_NAME: sentinel-api
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Synchronize Sentinel API key
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az extension add --name containerapp --upgrade
            az containerapp secret set \
              --name ${{ secrets.CONTAINER_APP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --secrets "sentinel-api-key=${{ secrets.SENTINEL_API_KEY }}"

      - name: Log in to Azure Container Registry
        run: |
          ACR_NAME="${{ secrets.ACR_LOGIN_SERVER }}"
          ACR_NAME="${ACR_NAME%%.*}"
          az acr login --name "$ACR_NAME"

      - name: Build and push container image
        run: |
          docker build \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest \
            .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Create one valid Container App revision
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az extension add --name containerapp --upgrade
            az containerapp secret set \
              --name ${{ secrets.CONTAINER_APP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --secrets "sentinel-hmac-secret=${{ secrets.SENTINEL_HMAC_SECRET }}" \
              "sentinel-api-key=${{ secrets.SENTINEL_API_KEY }}"

            SHORT_SHA="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
            REVISION_SUFFIX="sha-${SHORT_SHA}-${GITHUB_RUN_NUMBER}"

            az containerapp update \
              --name ${{ secrets.CONTAINER_APP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --image ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
              --set-env-vars \
                PORT=3000 \
                SENTINEL_HMAC_SECRET=secretref:sentinel-hmac-secret \
                SENTINEL_API_KEY=secretref:sentinel-api-key \
                SENTINEL_API_KEY_TENANT=nunncloud \
                SENTINEL_API_KEY_ACTOR=sentinel.repo-reader@nunncloud.local \
                SENTINEL_API_KEY_ROLE=viewer \
                SENTINEL_API_KEY_SCOPES=repo:read,audit:read,receipt:read,approval:read \
              --revision-suffix "$REVISION_SUFFIX"

            az containerapp ingress update \
              --name ${{ secrets.CONTAINER_APP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --target-port 3000 \
              --output none

      - name: Apply probe contract to the exact revision
        shell: bash
        env:
          EXPECTED_IMAGE: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        run: |
          set -euo pipefail
          APP_NAME="${{ secrets.CONTAINER_APP_NAME }}"
          RG="${{ secrets.AZURE_RESOURCE_GROUP }}"
          SHORT_SHA="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          REVISION_SUFFIX="sha-${SHORT_SHA}-${GITHUB_RUN_NUMBER}"
          RESOURCE_ID="$(az containerapp show --name "$APP_NAME" --resource-group "$RG" --query id -o tsv)"

          az containerapp show --name "$APP_NAME" --resource-group "$RG" -o json > /tmp/containerapp-live.json

          python - <<'PY'
import json
import os

with open('/tmp/containerapp-live.json', 'r', encoding='utf-8') as fh:
    app = json.load(fh)

containers = app.get('properties', {}).get('template', {}).get('containers', [])
if not containers:
    raise SystemExit('No containers found for the live Container App.')

sentinel = next((container for container in containers if container.get('name') == 'sentinel'), None)
if sentinel is None:
    raise SystemExit('No named sentinel container found in the live app config.')

sentinel['image'] = os.environ['EXPECTED_IMAGE']
env_items = sentinel.setdefault('env', [])
env_map = {entry.get('name'): entry for entry in env_items if isinstance(entry, dict) and entry.get('name')}
env_map['PORT'] = {'name': 'PORT', 'value': '3000'}
env_map['SENTINEL_HMAC_SECRET'] = {'name': 'SENTINEL_HMAC_SECRET', 'secretRef': 'sentinel-hmac-secret'}
sentinel['env'] = list(env_map.values())

required_probe_map = {
  'Startup': {'path': '/health', 'port': 3000, 'scheme': 'HTTP', 'initialDelaySeconds': 5, 'periodSeconds': 10, 'timeoutSeconds': 3, 'failureThreshold': 30},
  'Readiness': {'path': '/health', 'port': 3000, 'scheme': 'HTTP', 'initialDelaySeconds': 5, 'periodSeconds': 10, 'timeoutSeconds': 3, 'failureThreshold': 3},
  'Liveness': {'path': '/health', 'port': 3000, 'scheme': 'HTTP', 'initialDelaySeconds': 10, 'periodSeconds': 30, 'timeoutSeconds': 3, 'failureThreshold': 3}
}

probe_list = sentinel.setdefault('probes', [])
probe_by_type = {probe.get('type'): probe for probe in probe_list if isinstance(probe, dict) and probe.get('type')}
for probe_type, details in required_probe_map.items():
    probe = probe_by_type.get(probe_type) or {'type': probe_type}
    probe['httpGet'] = {'path': details['path'], 'port': details['port'], 'scheme': details['scheme']}
    probe['initialDelaySeconds'] = details['initialDelaySeconds']
    probe['periodSeconds'] = details['periodSeconds']
    probe['timeoutSeconds'] = details['timeoutSeconds']
    probe['failureThreshold'] = details['failureThreshold']
    probe_by_type[probe_type] = probe

sentinel['probes'] = list(probe_by_type.values())
patch = {
  'properties': {
    'configuration': {
      'ingress': {'targetPort': 3000}
    },
    'template': {
      'containers': [
        {
          'name': 'sentinel',
          'image': os.environ['EXPECTED_IMAGE'],
          'env': sentinel['env'],
          'probes': sentinel['probes']
        }
      ]
    }
  }
}
with open('/tmp/containerapp-healthfix-patch.json', 'w', encoding='utf-8') as fh:
    json.dump(patch, fh)
PY

          az rest \
            --method patch \
            --uri "https://management.azure.com${RESOURCE_ID}?api-version=2025-01-01" \
            --headers "Content-Type=application/merge-patch+json" \
            --body @/tmp/containerapp-healthfix-patch.json \
            --output none

          echo "Revision suffix to validate: ${REVISION_SUFFIX}"

      - name: Wait for exact revision health
        shell: bash
        env:
          EXPECTED_IMAGE: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          EXPECTED_PORT: '3000'
          REQUIRED_TRAFFIC_WEIGHT: '100'
        run: |
          set -euo pipefail
          APP_NAME="${{ secrets.CONTAINER_APP_NAME }}"
          RG="${{ secrets.AZURE_RESOURCE_GROUP }}"
          SHORT_SHA="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          EXPECTED_REVISION_SUFFIX="sha-${SHORT_SHA}-${GITHUB_RUN_NUMBER}"
          EXPECTED_TRY_COUNT=30

          for attempt in $(seq 1 "$EXPECTED_TRY_COUNT"); do
            APP_JSON="$(az containerapp show --name "$APP_NAME" --resource-group "$RG" -o json)"
            REVISION_JSON="$(az containerapp revision list --name "$APP_NAME" --resource-group "$RG" -o json)"
            echo "$APP_JSON" > /tmp/sentinel-app.json
            echo "$REVISION_JSON" > /tmp/sentinel-revisions.json

            if EXPECTED_REVISION_SUFFIX="$EXPECTED_REVISION_SUFFIX" \
               EXPECTED_IMAGE="$EXPECTED_IMAGE" \
               EXPECTED_PORT="$EXPECTED_PORT" \
               REQUIRED_TRAFFIC_WEIGHT="$REQUIRED_TRAFFIC_WEIGHT" \
               node scripts/validate-live-azure-deployment-contract.js /tmp/sentinel-app.json /tmp/sentinel-revisions.json; then
              echo "Exact revision settled successfully on attempt ${attempt}."
              exit 0
            fi

            echo "Revision not yet healthy; waiting for rollout to settle (attempt ${attempt}/${EXPECTED_TRY_COUNT})..."
            sleep 20
          done

          echo "Expected revision $EXPECTED_REVISION_SUFFIX did not reach Healthy + Provisioned + 100% traffic within the retry window."
          exit 1

      - name: Verify live deployment contract
        shell: bash
        env:
          EXPECTED_IMAGE: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          EXPECTED_PORT: '3000'
          REQUIRED_TRAFFIC_WEIGHT: '100'
        run: |
          set -euo pipefail
          APP_NAME="${{ secrets.CONTAINER_APP_NAME }}"
          RG="${{ secrets.AZURE_RESOURCE_GROUP }}"
          SHORT_SHA="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          EXPECTED_REVISION_SUFFIX="sha-${SHORT_SHA}-${GITHUB_RUN_NUMBER}"

          APP_JSON="$(az containerapp show --name "$APP_NAME" --resource-group "$RG" -o json)"
          REVISION_JSON="$(az containerapp revision list --name "$APP_NAME" --resource-group "$RG" -o json)"

          echo "$APP_JSON" > /tmp/sentinel-app.json
          echo "$REVISION_JSON" > /tmp/sentinel-revisions.json

          EXPECTED_REVISION_SUFFIX="$EXPECTED_REVISION_SUFFIX" \
          EXPECTED_IMAGE="$EXPECTED_IMAGE" \
          EXPECTED_PORT="$EXPECTED_PORT" \
          REQUIRED_TRAFFIC_WEIGHT="$REQUIRED_TRAFFIC_WEIGHT" \
          node scripts/validate-live-azure-deployment-contract.js /tmp/sentinel-app.json /tmp/sentinel-revisions.json

      - name: Smoke test live endpoint
        uses: azure/CLI@v2
        with:
          inlineScript: |
            FQDN="$(az containerapp show \
              --name ${{ secrets.CONTAINER_APP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --query properties.configuration.ingress.fqdn \
              --output tsv)"

            echo "Testing https://${FQDN}/health"
            HEALTH_JSON="$(curl --fail --show-error --silent --max-time 30 "https://${FQDN}/health")"
            echo "$HEALTH_JSON"
            python - "$HEALTH_JSON" <<'PY'
import json, sys
payload = json.loads(sys.argv[1])
if payload.get('status') != 'ok':
    raise SystemExit(f"Unexpected /health status: {payload.get('status')}")
if payload.get('service') != 'sentinel-api':
    raise SystemExit(f"Unexpected service name: {payload.get('service')}")
PY

            echo "Testing unauthenticated protected route"
            UNAUTH_STATUS="$(curl --silent --show-error --max-time 30 -o /tmp/approvals-unauth.json -w '%{http_code}' "https://${FQDN}/approvals")"
            if [[ "$UNAUTH_STATUS" != "401" && "$UNAUTH_STATUS" != "403" ]]; then
              echo "Expected 401/403 for unauthenticated /approvals, got $UNAUTH_STATUS"
              cat /tmp/approvals-unauth.json
              exit 1
            fi

            echo "Testing authenticated protected route"
            curl --fail --show-error --silent --max-time 30 "https://${FQDN}/approvals" \
              -H "x-api-key: ${{ secrets.SENTINEL_API_KEY }}"
            echo

            az containerapp revision list \
              --name ${{ secrets.CONTAINER_APP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --query "[?trafficWeight==\`100\`].[name,healthState,provisioningState,trafficWeight]" \
              --output table

      - name: Show deployment target
        run: |
          echo "Deployed image: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          echo "Updated latest: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest"
          echo "Container App: ${{ secrets.CONTAINER_APP_NAME }}"

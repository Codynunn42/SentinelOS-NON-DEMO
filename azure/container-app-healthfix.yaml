# SentinelOS - Azure Container Apps port-3000 contract reference
# NON-APPLICABLE REFERENCE ONLY.
# Do not pass this file directly to az containerapp update.
# The governed deploy workflow reads the current app, injects an exact-SHA image,
# preserves sidecars, coordinates ingress and template changes in one PATCH,
# and validates the resulting exact revision before reporting success.

properties:
  configuration:
    ingress:
      targetPort: 3000
  template:
    containers:
      - name: sentinel
        env:
          - name: PORT
            value: "3000"
        probes:
          - type: Startup
            httpGet:
              path: /health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          - type: Readiness
            httpGet:
              path: /health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          - type: Liveness
            httpGet:
              path: /health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3

